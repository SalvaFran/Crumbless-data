name: Overture probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q duckdb
      - run: python3 overture.py
      - run: ls -la overture.json && gzip -k overture.json && ls -la overture.json.gz
