name: Update gluten-free places
on:
  schedule: [{ cron: '17 3 * * *' }]   # every night, 03:17 UTC
  workflow_dispatch:                    # "Run workflow" button
permissions: { contents: write }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Extract gluten-free places from the planet
        run: ./extract.sh
      - name: Build tiles
        run: python3 build.py
      - name: Commit if anything changed
        run: |
          git config user.name "crumbless-bot"
          git config user.email "crumbless-bot@users.noreply.github.com"
          git add -A tiles meta.json
          git diff --cached --quiet || (git commit -q -m "Data update $(date -u +%F)" && git push)
